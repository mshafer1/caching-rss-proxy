services:
  web:
    build:
      context: ..
      dockerfile: hosting/Dockerfile
    ports:
      - '0.0.0.0:8081:8081'
    env_file: # TODO: I thought this was the default??
      - .env
    environment:
      RSS_STORAGE_PATH: /mnt/rss_storage
    volumes:
      - './rss_cache:/mnt/rss_storage'
